name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: pos_inventory_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_pgsql, pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: G1 autoload PSR-4 (folder = namespace)
        run: composer dump-autoload --strict-psr

      - name: G3 tidak ada model di app/Models
        run: test -z "$(find app/Models -name '*.php' 2>/dev/null)"

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: G4 Pint
        run: vendor/bin/pint --test

      - name: G5 Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: G6 Pest (Unit, Feature, Arch; PostgreSQL)
        run: vendor/bin/pest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: F1 Oxlint
        run: npx oxlint .

      - name: F2 ESLint
        run: npx eslint . --no-warn-ignored

      - name: F3 Prettier
        run: npx prettier --check src

      - name: F4 Unit test (Vitest)
        run: npm run test:unit -- --run

      - name: F5 Build (vue-tsc + Vite)
        run: npm run build